<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Square with Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Outer glowing accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#34d399" stroke-width="8" stroke-opacity="0.5" />

  <!-- Inner QR Code Elements (Clean Crisp White) -->
  <g fill="#ffffff">
    <!-- Top-Left Target (Outer Box, Inner Eye) -->
    <rect x="96" y="96" width="112" height="112" rx="24" />
    <rect x="124" y="124" width="56" height="56" rx="12" fill="#059669" />
    <rect x="140" y="140" width="24" height="24" rx="6" fill="#ffffff" />

    <!-- Top-Right Target (Outer Box, Inner Eye) -->
    <rect x="304" y="96" width="112" height="112" rx="24" />
    <rect x="332" y="124" width="56" height="56" rx="12" fill="#059669" />
    <rect x="348" y="140" width="24" height="24" rx="6" fill="#ffffff" />

    <!-- Bottom-Left Target (Outer Box, Inner Eye) -->
    <rect x="96" y="304" width="112" height="112" rx="24" />
    <rect x="124" y="332" width="56" height="56" rx="12" fill="#059669" />
    <rect x="140" y="348" width="24" height="24" rx="6" fill="#ffffff" />

    <!-- Data Pattern Elements -->
    <rect x="236" y="96" width="40" height="40" rx="8" />
    <rect x="236" y="168" width="40" height="40" rx="8" />
    
    <rect x="96" y="236" width="40" height="40" rx="8" />
    <rect x="168" y="236" width="40" height="40" rx="8" />
    <rect x="236" y="236" width="40" height="40" rx="8" />
    <rect x="304" y="236" width="40" height="40" rx="8" />
    <rect x="376" y="236" width="40" height="40" rx="8" />

    <rect x="236" y="304" width="40" height="40" rx="8" />
    <rect x="304" y="304" width="40" height="40" rx="8" />
    <rect x="376" y="304" width="40" height="40" rx="8" />

    <rect x="236" y="376" width="40" height="40" rx="8" />
    <rect x="304" y="376" width="112" height="40" rx="8" />
  </g>
</svg>
